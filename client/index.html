<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title + metas se reemplazan server-side al servir el HTML
         (server/lib/htmlBranding.js lee getBranding() y transforma) y
         también vía useBranding() en runtime. Los valores hardcoded acá
         son el default starter, sólo se ven si servís el archivo crudo. -->
    <title>Mi Portal</title>
    <meta name="description" content="Tu comunidad en un solo lugar" />

    <!-- Open Graph / Twitter (preview en redes) -->
    <meta property="og:title" content="Mi Portal" />
    <meta property="og:description" content="Tu comunidad en un solo lugar" />
    <meta property="og:image" content="icons/icon-512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mi Portal" />
    <meta name="twitter:description" content="Tu comunidad en un solo lugar" />

    <!-- Fonts: Gotham self-hosted (WOFF2) — única familia.
         Preload del Book + Black para que el primer paint no parpadee.
         @font-face declarations viven en src/styles.css.
         Paths ABSOLUTOS (/portal/) porque cuando la URL es /inicio
         (Vercel rewrite a /portal/index.html), las paths relativas
         resuelven contra /inicio → 404. -->
    <link rel="preload" href="/portal/fonts/holistic/gotham-book.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/portal/fonts/holistic/gotham-black.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Fraunces (variable serif, Google Fonts) — usado en /shop y
         /shop/:slug como accent italic editorial (matchea el landing,
         que ya la carga en BaseLayout.astro). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500;1,9..144,600&display=swap" />

    <!-- PWA Meta Tags -->
    <meta name="application-name" content="Mi Portal" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mi Portal" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#3B82F6" />
    <meta name="msapplication-TileColor" content="#04060d" />
    <meta name="msapplication-TileImage" content="icons/icon-192.png" />

    <!-- Manifest — path ABSOLUTO /portal/manifest.json para que funcione
         cuando la URL es /inicio, /admin, /shop, etc. (Vercel rewrites
         envían esas URLs al /portal/index.html pero el browser resuelve
         paths relativos contra la URL en barra). -->
    <link rel="manifest" href="/portal/manifest.json" />

    <!-- Apple Touch Icons (mismo razonamiento: paths absolutos) -->
    <link rel="apple-touch-icon" href="/portal/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/portal/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/portal/icons/icon-512.png" />

    <!-- Favicon — overrideado en runtime por useBranding() si admin sube uno. -->
    <link rel="icon" type="image/svg+xml" href="/portal/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/portal/icons/icon-192.png" />
  <style>
    /* ══════════════════════════════════════════════════════════════════════
       DESIGN SYSTEM — Holistic Portal v2 (2026-05-23)
       Swiss Modernism 2.0 + Dark Mode OLED + Exaggerated Minimalism.
       Tokens FIJOS — el usuario NO los puede cambiar en runtime (el wizard
       de admin sigue editando branding.name/slogan/logo pero los colores
       quedan congelados acá para garantizar consistencia visual).
       ══════════════════════════════════════════════════════════════════════ */
    :root {
      /* ── Surface palette (OLED-friendly) ── */
      --c-bg:           #06070A;     /* deep near-black, slight cool tint */
      --c-surface:      #0E1014;     /* card / panel */
      --c-surface-2:    #161A20;     /* elevated card */
      --c-surface-3:    #1F242C;     /* hover / focused surface */

      /* ── Text scale (4.5:1+ contrast) ── */
      --c-text:         #F5F2EB;     /* primary — warm off-white */
      --c-text-rgb:     245, 242, 235; /* para rgba(var(--c-text-rgb), α) con alpha arbitrario */
      --c-text-2:       rgba(245, 242, 235, 0.72);
      --c-text-3:       rgba(245, 242, 235, 0.50);
      --c-text-disabled:rgba(245, 242, 235, 0.30);

      /* ── Brand accents (mint Holistic) ── */
      --c-accent:       #A7F5C8;     /* primary mint */
      --c-accent-rgb:   167, 245, 200;
      --c-accent-2:     #25D366;     /* CTA strong */
      --c-accent-soft:  rgba(167, 245, 200, 0.10);
      --c-accent-glow:  rgba(167, 245, 200, 0.32);

      /* ── Borders ── */
      --c-border:       rgba(255, 255, 255, 0.06);
      --c-border-2:     rgba(255, 255, 255, 0.10);
      --c-border-3:     rgba(255, 255, 255, 0.16);

      /* ── Status ── */
      --c-success:      #86EFAC;
      --c-warning:      #FCD34D;
      --c-danger:       #FCA5A5;
      --c-info:         #93C5FD;

      /* ── Typography ── */
      --f-display:      'Gotham', system-ui, sans-serif;
      --f-body:         'Gotham', system-ui, sans-serif;
      --f-italic:       'Fraunces', Georgia, serif;
      --f-mono:         'Gotham', ui-monospace, monospace;

      /* ── Spacing scale (8px base) ── */
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
      --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
      --sp-12: 48px; --sp-16: 64px; --sp-20: 80px;

      /* ── Radii ── */
      --r-1: 6px; --r-2: 10px; --r-3: 14px; --r-4: 18px; --r-5: 24px; --r-pill: 999px;

      /* ── Shadows ── */
      --shadow-sm:  0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-md:  0 8px 24px -6px rgba(0, 0, 0, 0.5);
      --shadow-lg:  0 22px 60px -12px rgba(0, 0, 0, 0.65);
      --shadow-glow:0 0 30px -6px var(--c-accent-glow);

      /* ── Motion ── */
      --ease-out:       cubic-bezier(.2, .8, .2, 1);
      --ease-spring:    cubic-bezier(.34, 1.56, .64, 1);
      --dur-fast:       150ms;
      --dur-base:       240ms;
      --dur-slow:       400ms;

      /* ── Z-index scale (predecible) ── */
      --z-base: 1; --z-dropdown: 50; --z-sticky: 100; --z-fixed: 200;
      --z-modal-bg: 300; --z-modal: 400; --z-toast: 500;

      /* ── Layout ── */
      --container: 1200px;
      --container-wide: 1440px;

      /* ── Legacy aliases (compat con código antiguo) ── */
      --brand-bg:       var(--c-bg);
      --brand-text:     var(--c-text);
      --brand-primary:  var(--c-accent);
      --brand-primary-rgb: var(--c-accent-rgb);
      --brand-accent:   var(--c-accent-2);
      --brand-font:     var(--f-body);
      --black:          var(--c-bg);
      --dark:           var(--c-surface);
      --card:           var(--c-surface);
      --white:          var(--c-text);
      --ghost:          var(--c-text-3);
      --border:         var(--c-border);
      --border2:        var(--c-border-2);
      /* Legacy lemon/orange — quedan apuntando al accent para no romper
         estilos viejos, pero ya no se usan visualmente. */
      --lemon:          var(--c-accent);
      --orange:         var(--c-accent-2);
      --legacy-orange:  var(--c-accent);
      --legacy-orange-hot: var(--c-accent-2);

      color-scheme: dark;
    }

    /* ── Reset + base typography ── */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    html, body { margin: 0; padding: 0; overflow-x: hidden; }
    body {
      background: var(--c-bg);
      color: var(--c-text);
      font-family: var(--f-body);
      font-size: 15px;
      line-height: 1.55;
      letter-spacing: 0.005em;
      min-height: 100vh;
    }

    /* Focus ring premium — visible para keyboard nav (a11y critical) */
    *:focus { outline: none; }
    *:focus-visible {
      outline: 2px solid var(--c-accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* Selección de texto */
    ::selection { background: var(--c-accent-soft); color: var(--c-text); }

    /* Link reset */
    a { color: inherit; }

    /* Headings — declarative scale */
    h1, h2, h3, h4, h5 { margin: 0; font-family: var(--f-display); font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; }
    p { margin: 0; }

    /* Reduced motion respect */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ── Helpers tipográficos ── */
    .ff-bebas { font-family: var(--f-display); font-weight: 900; letter-spacing: 0; }
    .ff-mono  { font-family: var(--f-mono); font-weight: 700; letter-spacing: 0.04em; }
    .ff-cond  { font-family: var(--f-display); font-weight: 700; letter-spacing: 0.02em; }
    .ff-italic{ font-family: var(--f-italic); font-style: italic; font-weight: 500; letter-spacing: -0.015em; }
    .lbl-mono {
      font-family: var(--f-body); font-weight: 700;
      font-size: 10px; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--c-text-3);
    }
    .eyebrow {
      font-family: var(--f-body); font-weight: 700;
      font-size: 11px; letter-spacing: 0.28em;
      text-transform: uppercase; color: var(--c-accent);
      display: inline-flex; align-items: center; gap: 12px;
    }
    .eyebrow::before {
      content: ''; width: 24px; height: 1px;
      background: var(--c-accent);
      opacity: 0.7;
    }

    /* ── Scrollbar minimalista ── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: var(--r-pill);
      transition: background var(--dur-base) var(--ease-out);
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.18); }

    /* ── Tabla responsive (refinada) ── */
    .tableWrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .table {
      width: 100%; border-collapse: collapse;
      font-size: 13px; min-width: 600px;
    }
    .table th {
      padding: 12px 14px;
      text-align: left;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--c-text-3);
      border-bottom: 1px solid var(--c-border);
      white-space: nowrap;
    }
    .table td {
      padding: 14px;
      border-bottom: 1px solid var(--c-border);
      vertical-align: middle;
      color: var(--c-text-2);
    }
    .table tr:hover td { background: rgba(255, 255, 255, 0.02); }
    .muted { color: var(--c-text-3); }
    .pill {
      display: inline-flex; align-items: center;
      padding: 3px 10px;
      border-radius: var(--r-pill);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--c-border);
      font-size: 11px; font-weight: 700;
      font-family: var(--f-mono);
      letter-spacing: 0.04em;
      color: var(--c-text-2);
    }

    /* ── Inputs globales (minimalista, subtle border) ── */
    .input {
      background: var(--c-surface);
      border: 1px solid var(--c-border-2);
      border-radius: var(--r-2);
      color: var(--c-text);
      font-size: 14px;
      padding: 11px 14px;
      outline: none;
      transition:
        border-color var(--dur-base) var(--ease-out),
        background var(--dur-base) var(--ease-out),
        box-shadow var(--dur-base) var(--ease-out);
      font-family: inherit;
      width: 100%;
      box-sizing: border-box;
    }
    .input:hover { border-color: var(--c-border-3); }
    .input:focus {
      border-color: var(--c-accent);
      background: var(--c-surface-2);
      box-shadow: 0 0 0 3px rgba(var(--c-accent-rgb), 0.18);
    }
    .input::placeholder { color: var(--c-text-3); }
    select.input { cursor: pointer; }

    /* ── Botones globales (sistema unificado) ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 40px;
      min-width: 44px;            /* a11y touch target */
      padding: 0 18px;
      border-radius: var(--r-2);
      border: 1px solid var(--c-border-2);
      background: var(--c-surface);
      color: var(--c-text);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition:
        background var(--dur-base) var(--ease-out),
        border-color var(--dur-base) var(--ease-out),
        color var(--dur-base) var(--ease-out),
        transform var(--dur-fast) var(--ease-out);
      font-family: inherit;
      white-space: nowrap;
    }
    .btn:hover {
      background: var(--c-surface-2);
      border-color: var(--c-border-3);
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btnPrimary {
      background: linear-gradient(135deg, var(--c-accent-2), #1AAE54) !important;
      color: #07130c !important;
      border: 1px solid rgba(167, 245, 200, 0.4) !important;
      font-weight: 800;
      box-shadow: 0 8px 22px -6px rgba(37, 211, 102, 0.5);
    }
    .btnPrimary:hover {
      box-shadow:
        0 14px 32px -8px rgba(37, 211, 102, 0.6),
        0 0 0 1.5px rgba(167, 245, 200, 0.6) !important;
      transform: translateY(-1px);
    }
    .btnPrimary:active { transform: translateY(0); }

    /* ── Cards globales ── */
    .card {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--r-3);
      padding: var(--sp-6);
      transition: border-color var(--dur-base) var(--ease-out), background var(--dur-base) var(--ease-out);
    }
    .card:hover { border-color: var(--c-border-2); }

    /* ── Badges de estado ── */
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px;
      border-radius: var(--r-pill);
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.06em;
    }
    .badge--success { background: rgba(134,239,172,0.10); color: var(--c-success); }
    .badge--warn    { background: rgba(252,211,77,0.10);  color: var(--c-warning); }
    .badge--danger  { background: rgba(252,165,165,0.10); color: var(--c-danger); }
    .badge--accent  { background: var(--c-accent-soft); color: var(--c-accent); }
    
    /* ── Screen wrapper ── */
    .screen { padding: 0 16px 40px; }
    
    /* ── Grid 2 cols → 1 col en mobile ── */
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    
    /* ── Sidebar global ── */
    .sidebar-wrap { transition: width .3s; }
    
    /* ── RESPONSIVE MOBILE ── */
    @media (max-width: 768px) {
      .grid2 { grid-template-columns: 1fr !important; }
      .screen { padding: 0 10px 32px; }
      .table { font-size: 12px; }
      .table th, .table td { padding: 8px 10px; }
      .sidebar-wrap { width: 68px !important; }
      .sb-label { display: none !important; }
      .sb-btn { width: 56px !important; padding: 12px 6px !important; }
      .op-kpi-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .op-tabs { flex-wrap: wrap !important; gap: 6px !important; }
      input, select, textarea { font-size: 16px !important; } /* evita zoom en iOS */
    }
    
    @media (max-width: 480px) {
      .op-kpi-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .sidebar-wrap { width: 52px !important; }
    }
    
    /* ── Upload avatar en mobile ── */
    input[type="file"] { font-size: 14px; }
    
    /* ── Topbar mobile ── */
    @media (max-width: 600px) {
      .hide-mobile { display: none !important; }
      .tb-inner { padding: 0 12px !important; height: 56px !important; }
      .tb-logo { font-size: 16px !important; letter-spacing: 3px !important; }
      .tb-user-btn { padding: 6px 10px !important; gap: 6px !important; }
      .tb-name { font-size: 12px !important; }
      .tb-role { font-size: 8px !important; padding: 1px 6px !important; }
      .tb-logout { padding: 6px 12px !important; font-size: 11px !important; }
      .tb-shell { height: 56px !important; }
    }
    
    /* ── LemonCoins mobile ── */
    @media (max-width: 600px) {
      .tab-btn { width: 72px !important; padding: 10px 4px !important; }
    }
    
    /* ── Cards responsive ── */
    @media (max-width: 600px) {
      .screen { padding: 0 8px 24px !important; }
    }
  </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
