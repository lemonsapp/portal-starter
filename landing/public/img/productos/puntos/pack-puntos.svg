<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Pack de puntos Holistic">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52b788"/>
      <stop offset="1" stop-color="#2E8F6E"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#d8f3e6" stop-opacity=".8"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="360" height="360" rx="40" fill="url(#g)"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="2"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
  <!-- Gema / diamante -->
  <g transform="translate(200 168)">
    <path d="M-58 -18 L-30 -52 L30 -52 L58 -18 L0 56 Z" fill="url(#gem)"/>
    <path d="M-58 -18 L58 -18 M-30 -52 L-16 -18 L0 56 M30 -52 L16 -18 L0 56 M-16 -18 L16 -18"
          fill="none" stroke="#2E8F6E" stroke-opacity=".35" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <text x="200" y="300" text-anchor="middle" font-family="'Gotham', Arial, sans-serif"
        font-size="46" font-weight="800" letter-spacing="6" fill="#ffffff">PUNTOS</text>
  <text x="200" y="338" text-anchor="middle" font-family="'Gotham', Arial, sans-serif"
        font-size="18" font-weight="600" letter-spacing="3" fill="#ffffff" fill-opacity=".8">HOLISTIC</text>
</svg>
